version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: afterhours
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: production_password
      MYSQL_USER: afterhours_user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=mysql+aiomysql://afterhours_user:production_password@db/afterhours
      - SECRET_KEY=your_production_secret_key_change_this
      - PROJECT_NAME=AfterHours AI
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
